name: Phase 2 Batch 2 Build

on:
  push:
    branches: [phase-2-batch-2]

permissions:
  contents: write

jobs:
  build:
    if: github.actor == 'crpeter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-2-batch-2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate.py
      - run: python scripts/build_index.py
      - run: python -m unittest discover -s tests
      - name: Commit generated artifacts when needed
        run: |
          if ! git diff --quiet -- docs/ dist/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ dist/
            git commit -m "Regenerate Phase 2 batch 2 artifacts"
            git push origin HEAD:phase-2-batch-2
          fi
